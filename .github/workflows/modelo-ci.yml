name: Modelo CI
on:
  push:
    paths: ["Modelo/**"]
  pull_request:
    paths: ["Modelo/**"]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        if: hashFiles('Modelo/requirements.txt') != ''
      - run: scripts/lint-folder.sh Modelo requirements.txt pip install -r requirements.txt ruff pytest
      - run: scripts/lint-folder.sh Modelo requirements.txt ruff check .
      - run: scripts/lint-folder.sh Modelo requirements.txt pytest
