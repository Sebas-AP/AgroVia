name: AppMovil CI
on:
  push:
    paths: ["AppMovil/**"]
  pull_request:
    paths: ["AppMovil/**"]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
        if: hashFiles('AppMovil/AgroViaApp/agrovia-figma-android-/app/build.gradle.kts') != ''
      - uses: gradle/actions/setup-gradle@v4
        if: hashFiles('AppMovil/AgroViaApp/agrovia-figma-android-/app/build.gradle.kts') != ''
      - run: scripts/lint-folder.sh AppMovil/AgroViaApp/agrovia-figma-android- app/build.gradle.kts ./gradlew :app:assembleDebug
