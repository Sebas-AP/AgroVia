services:
  - type: web
    name: agrovia-modelo
    runtime: python
    plan: free
    rootDir: Modelo
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn agrovia_api.main:app --host 0.0.0.0 --port $PORT
    # No env vars required: NASA POWER and ORNL DAAC are public, keyless APIs.
    # modelo_agrovia.joblib and datasets/*.json are already committed to the repo.

  - type: web
    name: agrovia-backend
    runtime: node
    plan: free
    rootDir: Backend
    # `tsc`'s compiled output doesn't resolve extensionless relative imports under native Node
    # ESM (`node dist/server.js` fails with ERR_MODULE_NOT_FOUND) — run via tsx instead, the
    # same way src/server.ts already runs in local dev and in scripts/run-local-stack.sh.
    # --include=dev is required: Render sets NODE_ENV=production for the install step, which
    # otherwise skips tsx (it's a devDependency).
    buildCommand: npm install --include=dev
    startCommand: npx tsx src/server.ts
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: agrovia-48930
      - key: USE_SIMULATED_PROVIDERS
        value: "false"
      # Render appended a random suffix to both service names on first deploy (name collision
      # avoidance) — the live hostname is agrovia-modelo-beul, not agrovia-modelo. Confirm on
      # the agrovia-modelo service's dashboard page if this is ever recreated.
      - key: MODELO_BASE_URL
        value: https://agrovia-modelo-beul.onrender.com
      - key: INTERNAL_SERVICE_KEY
        sync: false
      # firebase-admin needs real credentials outside the emulator. Render Secret Files aren't
      # reachable through this Blueprint flow, so server.ts reads the whole service-account
      # JSON (project agrovia-48930) from this one var instead of a file path — set its value
      # in the Render dashboard (Environment tab), never commit it.
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
